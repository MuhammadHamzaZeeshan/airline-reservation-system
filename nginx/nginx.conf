# Edge (lite): serves the React SPA and load-balances the API (2 nodes). Per-IP rate limit sheds excess with HTTP 429.
worker_processes auto;
events { worker_connections 8192; }

http {
  include /etc/nginx/mime.types;
  resolver 127.0.0.11 valid=5s ipv6=off;

  log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","req":"$request","status":$status,'
                              '"rt":$request_time,"upstream":"$upstream_addr","request_id":"$request_id"}';
  access_log /var/log/nginx/access.log json buffer=64k flush=5s;

  # Per-IP token bucket. Excess is SHED with 429 (never queued unboundedly).
  limit_req_zone $binary_remote_addr zone=perip:20m rate=300r/s;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=connperip:10m;
  limit_conn_status 429;

  upstream api {
    least_conn;
    # Passive health check: after 2 failures a node is skipped for 5 s (API node loss = no user impact).
    server api1:8000 max_fails=2 fail_timeout=5s;
    server api2:8000 max_fails=2 fail_timeout=5s;
    keepalive 128;
  }

  server {
    listen 80;
    root /usr/share/nginx/html;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    location ~ ^/(v1|health|docs|redoc|openapi\.json) {
      limit_req zone=perip burst=600 nodelay;
      limit_conn connperip 1000;

      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 1s;
      proxy_read_timeout 20s;
      # Retry on another node when one fails. Only idempotent methods are retried by nginx by default (POST is not).
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
      add_header X-Request-ID $request_id always;
    }

    location / { try_files $uri /index.html; }
  }
}
